[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "megafon-desktop"
version = "0.2.1"
description = "Windows desktop manager for consumer MegaFon accounts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "lvlaksim1"}]
dependencies = [
  "PySide6>=6.8,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "pyinstaller>=6.11,<7",
  "pillow>=11,<12",
]

[project.scripts]
megafon-desktop = "megafon_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megafon_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
