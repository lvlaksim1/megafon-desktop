name: Build Windows Installer

on:
  push:
    branches: [main]
    paths:
      - RELEASE_VERSION
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          choco install innosetup -y --no-progress

      - name: Run tests and lint
        shell: pwsh
        run: |
          pytest -q
          ruff check src tests packaging/generate_icon.py

      - name: Generate application icon
        shell: pwsh
        run: python packaging/generate_icon.py

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name "Megafon Desktop" `
            --icon "build\icon\megafon-desktop.ico" `
            --paths src `
            src/megafon_desktop/app.py

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          $kind = (Get-Content RELEASE_KIND -Raw).Trim()
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" "/DPackageKind=$kind" "packaging\megafon-desktop.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "dist-installer\MegafonDesktop-$kind-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_KIND=$kind" >> $env:GITHUB_ENV
          "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV
          "INSTALLER_NAME=MegafonDesktop-$kind-v$version.exe" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $notes = @"
          Megafon Desktop $tag

          HTTP-only authorization: no browser runtime dependency.
          Persistent per-account authorization is stored with Windows DPAPI.
          Interactive CAPTCHA is shown inside the application and resumes the same refresh.
          Manual per-account, selected-account and "Update all" refresh controls.
          New application/shortcut/installer icon.

          Windows installer: $env:INSTALLER_NAME

          This is a full-payload installer: it updates an existing installation in place and can
          also install Megafon Desktop when no previous version is present.

          Program: %LOCALAPPDATA%\Programs\Megafon Desktop
          Application data: %LOCALAPPDATA%\MegaFonDesktop
          Updates preserve application data and authorization state.
          Uninstall removes both locations and application-owned shortcuts/data.
          "@
          Set-Content -Path release-notes.txt -Value $notes -Encoding UTF8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER_PATH --clobber
          } else {
            gh release create $tag $env:INSTALLER_PATH `
              --target $env:GITHUB_SHA `
              --title "Megafon Desktop $tag" `
              --notes-file release-notes.txt
          }

      - name: Keep only the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = "v$env:RELEASE_VERSION"
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tagName -ne $currentTag) {
              Write-Host "Deleting old release $($release.tagName)"
              gh release delete $release.tagName --cleanup-tag --yes
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Purge Actions artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactIds = gh api --paginate "repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[].id'
          foreach ($artifactId in $artifactIds) {
            if ($artifactId) {
              Write-Host "Deleting workflow artifact $artifactId"
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$artifactId"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
